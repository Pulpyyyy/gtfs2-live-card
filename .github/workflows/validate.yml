name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: plugin
          # hacsjson and images read the repo through unauthenticated raw
          # urls, which a private repository refuses whatever the files
          # hold: re-enable both when the repo goes public.
          ignore: "hacsjson images"

  build:
    name: lang parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # dist/ is the source, served as is by HACS; what can drift is the five
      # language files, so fail when one misses or adds a key vs English.
      - run: python build.py --check
