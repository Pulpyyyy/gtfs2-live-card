<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Harnais de capture — gtfs2-live-card</title>
<style>
  :root {
    --card-background-color: #ffffff;
    --primary-text-color: #212121;
    --secondary-text-color: #727272;
    --divider-color: rgba(0, 0, 0, 0.12);
    --secondary-background-color: #fafafa;
    --primary-color: #03a9f4;
    --accent-color: #ff9800;
    --error-color: #db4437;
    --warning-color: #ffa600;
    --success-color: #43a047;
    --ha-card-border-radius: 12px;
    --ha-card-border-color: #e0e0e0;
    --page-bg: #fafafa;
  }
  :root.dark {
    --card-background-color: #1c1c1c;
    --primary-text-color: #e1e1e1;
    --secondary-text-color: #9b9b9b;
    --divider-color: rgba(225, 225, 225, 0.12);
    --secondary-background-color: #202020;
    --ha-card-border-color: #383838;
    --page-bg: #111111;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Roboto, "Segoe UI", system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--primary-text-color);
    -webkit-font-smoothing: antialiased;
  }
  #stage { padding: 20px; display: grid; gap: 18px; justify-content: center; align-content: start; }
  .cell { display: flex; flex-direction: column; gap: 6px; }
  .caption {
    font-size: 13px; font-weight: 500; color: var(--secondary-text-color);
    display: flex; align-items: center; gap: 7px; padding-left: 2px;
  }
  .caption .swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  #fatal { color: #e01f1f; font: 13px monospace; white-space: pre-wrap; padding: 12px; }
</style>
</head>
<body>
<div id="fatal"></div>
<div id="stage"></div>

<script>
/* ── Stubs des éléments Home Assistant ───────────────────────────────────
 * La carte n'en touche que deux : <ha-card>, son conteneur, et <ha-icon>,
 * qu'elle n'émet que si le capteur porte une icône différente de celle de
 * son mode. Tout le reste de son iconographie est du SVG inline. */
const MDI = {
  "mdi:bus": "M18,11H6V6H18M16.5,17A1.5,1.5 0 0,1 15,15.5A1.5,1.5 0 0,1 16.5,14A1.5,1.5 0 0,1 18,15.5A1.5,1.5 0 0,1 16.5,17M7.5,17A1.5,1.5 0 0,1 6,15.5A1.5,1.5 0 0,1 7.5,14A1.5,1.5 0 0,1 9,15.5A1.5,1.5 0 0,1 7.5,17M4,16C4,16.88 4.39,17.67 5,18.22V20A1,1 0 0,0 6,21H7A1,1 0 0,0 8,20V19H16V20A1,1 0 0,0 17,21H18A1,1 0 0,0 19,20V18.22C19.61,17.67 20,16.88 20,16V6C20,2.5 16.42,2 12,2C7.58,2 4,2.5 4,6V16Z",
  "mdi:tram": "M19,16.94V8.5C19,5.71 16.39,5.1 13,5L13.75,3.5H17V2H7V3.5H11.75L11,5C7.86,5.11 5,5.73 5,8.5V16.94C5,18.39 6.19,19.6 7.59,19.91L6,21.5V22H8.23L10.23,20H14L16,22H18V21.5L16.5,20H16.42C18.11,20 19,18.63 19,16.94M12,18.5A1.5,1.5 0 0,1 10.5,17A1.5,1.5 0 0,1 12,15.5A1.5,1.5 0 0,1 13.5,17A1.5,1.5 0 0,1 12,18.5M17,14H7V9H17V14Z",
};

class HaIcon extends HTMLElement {
  static get observedAttributes() { return ["icon"]; }
  connectedCallback() { this._render(); }
  attributeChangedCallback() { this._render(); }
  _render() {
    const d = MDI[this.getAttribute("icon")] || MDI["mdi:bus"];
    this.style.display = "inline-flex";
    this.style.alignItems = "center";
    this.style.justifyContent = "center";
    this.innerHTML =
      `<svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);` +
      `height:var(--mdc-icon-size,24px);fill:currentColor;display:block">` +
      `<path d="${d}"/></svg>`;
  }
}
customElements.define("ha-icon", HaIcon);

/* <ha-form> pilote l'éditeur : Home Assistant le rend à partir d'un schéma,
 * champ par champ. Ce stub en reprend la forme et les cinq sélecteurs que
 * l'éditeur de cette carte utilise — assez pour que la capture montre la
 * disposition réelle, sans prétendre imiter le composant au pixel près. */
class HaForm extends HTMLElement {
  set schema(v) { this._schema = v; this._render(); }
  set data(v) { this._data = v || {}; this._render(); }
  set hass(v) { this._hass = v; }
  set computeLabel(f) { this._label = f; this._render(); }

  _render() {
    if (!this._schema) return;
    this.style.display = "grid";
    this.style.gap = "14px";
    this.style.padding = "6px 0";
    this.innerHTML = "";
    for (const field of this._schema) {
      const kind = Object.keys(field.selector || {})[0] || "text";
      const value = (this._data || {})[field.name];
      const label = this._label ? this._label(field) : field.name;
      this.appendChild(kind === "boolean"
        ? this._toggle(label, value)
        : this._input(label, value, kind, field));
    }
  }

  _shell(label) {
    const box = document.createElement("div");
    box.style.cssText =
      "border-radius: 6px 6px 0 0; background: var(--secondary-background-color);" +
      "border-bottom: 1px solid var(--secondary-text-color); padding: 8px 12px 6px;";
    const cap = document.createElement("div");
    cap.textContent = label;
    cap.style.cssText = "font-size: 12px; color: var(--secondary-text-color); margin-bottom: 3px;";
    box.appendChild(cap);
    return box;
  }

  _input(label, value, kind, field) {
    const box = this._shell(label);
    const val = document.createElement("div");
    // une liste montre le libellé de l'option choisie, comme Home Assistant,
    // pas sa valeur : « Sensor's origin », jamais « @origin »
    const opts = field?.selector?.select?.options || [];
    const labelOf = (v) => {
      const o = opts.find((x) => (typeof x === "object" ? x.value : x) === v);
      return o && typeof o === "object" ? o.label : v;
    };
    if (kind === "select") value = Array.isArray(value) ? value.map(labelOf) : labelOf(value);
    const shown = value === "" || value == null
      ? (kind === "entity" ? "" : "—")
      : Array.isArray(value) ? value.join(", ") : String(value);
    val.textContent = shown;
    val.style.cssText = "font-size: 15px; color: var(--primary-text-color); min-height: 20px;" +
      (shown === "—" ? "opacity:.35;" : "");
    box.appendChild(val);
    if (kind === "select") {
      box.style.position = "relative";
      const caret = document.createElement("div");
      caret.textContent = "▾";
      caret.style.cssText = "position:absolute; right:12px; bottom:6px; color: var(--secondary-text-color);";
      box.appendChild(caret);
    }
    return box;
  }

  _toggle(label, on) {
    const row = document.createElement("div");
    row.style.cssText = "display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 2px 0;";
    const cap = document.createElement("div");
    cap.textContent = label;
    cap.style.cssText = "font-size: 15px; color: var(--primary-text-color);";
    const sw = document.createElement("div");
    sw.style.cssText =
      "width:36px; height:20px; border-radius:10px; position:relative; flex: none;" +
      `background:${on ? "var(--primary-color)" : "var(--secondary-text-color)"};` +
      (on ? "" : "opacity:.4;");
    const knob = document.createElement("div");
    knob.style.cssText =
      "position:absolute; top:2px; width:16px; height:16px; border-radius:50%;" +
      `background:#fff; ${on ? "right:2px" : "left:2px"};`;
    sw.appendChild(knob);
    row.append(cap, sw);
    return row;
  }
}
customElements.define("ha-form", HaForm);

class HaCard extends HTMLElement {
  connectedCallback() {
    const s = this.style;
    s.display = "block";
    s.background = "var(--card-background-color)";
    s.borderRadius = "var(--ha-card-border-radius, 12px)";
    s.border = "1px solid var(--ha-card-border-color, rgba(0,0,0,0.12))";
    s.color = "var(--primary-text-color)";
    s.position = "relative";
    s.overflow = "hidden";
  }
}
customElements.define("ha-card", HaCard);
</script>

<!-- La vraie carte, telle que livrée. L'import est un module : la carte va
     chercher ses traductions dans ./lang/, à côté d'elle. -->
<script type="module">
import "../dist/gtfs2-live-card.js";

const q = new URLSearchParams(location.search);
const page = q.get("page") || "hero";
const dark = (q.get("mode") || "light") === "dark";
const lang = q.get("lang") || "fr";
document.documentElement.classList.toggle("dark", dark);

const fatal = (e) => {
  document.getElementById("fatal").textContent += "\n" + (e?.stack || e);
};
window.addEventListener("error", (e) => fatal(e.message));
window.addEventListener("unhandledrejection", (e) => fatal(e.reason));

/* ── Les données, telles qu'elles ont été photographiées ──────────────────
 * data/stops.json vient du GTFS de TAO (tracés, arrêts) ; les positions et
 * les départs viennent d'un instantané du flux temps réel. Voir data/. */
const [network, snap, deps, ...positions] = await Promise.all([
  fetch("data/stops.json").then((r) => r.json()),
  fetch("data/snapshot.json").then((r) => r.json()),
  fetch("data/departures.json").then((r) => r.json()),
  ...["tram-a", "tram-b", "bus-40"].map((f) =>
    fetch(`data/${f}.json`).then((r) => r.json())),
]);
const POS = { "tram-a": positions[0], "tram-b": positions[1], "bus-40": positions[2] };

/* L'instantané est daté : rejoué tel quel, il montrerait des départs vieux de
 * plusieurs heures, que la carte masquerait comme passés. On décale donc tout
 * le jeu de données du même intervalle, de sorte que le premier départ tombe
 * dans deux minutes. Les écarts entre passages, eux, sont ceux du réseau. */
const firstDep = Math.min(...Object.values(deps).flat().map((d) => d.time));
const SHIFT = Math.round(Date.now() / 1000) + 120 - firstDep;

const iso = (epoch) => {
  const d = new Date((epoch + SHIFT) * 1000);
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
         `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
};

/* Les positions sont servies telles quelles : la carte les lit par fetch,
 * donc on intercepte pour les rendre sans toucher au réseau ni au disque. */
const realFetch = window.fetch;
window.fetch = (input, init) => {
  const url = String(input?.url || input);
  // `\w` matches the underscore, so the line name has to stop before it or
  // "tram-a_route.json" would be read as a line called "tram-a_route"
  // le fichier de tronçon d'un capteur, nommé par son attribut leg_geojson_file
  const lm = url.match(/([a-z0-9-]+_leg_[a-z0-9]+)\.json(\?|$)/i);
  if (lm && LEGS[lm[1]]) {
    return Promise.resolve(new Response(JSON.stringify(legGeojson(lm[1])), {
      status: 200,
      headers: { "Content-Type": "application/json" },
    }));
  }
  const m = url.match(/([a-z0-9-]+?)(_route)?\.json(\?|$)/i);
  if (m && POS[m[1]]) {
    const body = m[2] ? routeGeojson(m[1]) : POS[m[1]];
    return Promise.resolve(new Response(JSON.stringify(body), {
      status: 200,
      headers: { "Content-Type": "application/json" },
    }));
  }
  return realFetch(input, init);
};

// une horloge GTFS, HH:MM:SS depuis minuit
const clock = (s) => [s / 3600, (s % 3600) / 60, s % 60]
  .map((v) => String(Math.floor(v)).padStart(2, "0")).join(":");

/* Le fichier de tracé, au format que gtfs2 exporte : le tracé en LineString,
 * puis un Point par arrêt. */
function routeGeojson(file) {
  const n = network[file];
  return {
    type: "FeatureCollection",
    features: [
      { type: "Feature", properties: {},
        geometry: { type: "LineString", coordinates: n.shape } },
      ...n.stops.map((s) => ({
        type: "Feature",
        // gtfs2 date chaque point de l'horaire du trajet dessiné ; l'extrait
        // n'en porte pas, on pose un passage toutes les 90 s, ce qui est ce
        // que la carte lit pour situer dans le temps un point du trajet
        properties: { stop_id: s.stop_id, stop_name: s.stop_name, stop_sequence: s.stop_sequence,
                      departure_time: clock(6 * 3600 + s.stop_sequence * 90) },
        geometry: { type: "Point", coordinates: [s.lon, s.lat] },
      })),
    ],
  };
}

/* Le fichier de tronçon, au format que gtfs2 exporte : pour chaque course
 * listée par le capteur, l'heure prévue à chaque arrêt de la ligne (un
 * passage toutes les 90 s depuis l'origine du capteur), et sur les premières
 * courses l'heure attendue et le retard, comme un flux qui couvre tous les
 * arrêts (TAO le fait). */
const LEGS = {};
function legGeojson(key) {
  const L = LEGS[key];
  const n = network[L.file];
  const trips = {};
  L.theo.forEach((t, i) => {
    const stops = {};
    for (const s of n.stops) {
      const sch = t + (s.stop_sequence - L.originSeq) * 90;
      const st = { sequence: s.stop_sequence, scheduled_arrival: iso(sch), scheduled: iso(sch) };
      if (i < L.rtRuns) { st.expected = iso(sch + (L.delays[i] || 0)); st.delay = L.delays[i] || 0; }
      // un arrêt que le flux raye sur cette course : skipped, sans heure attendue
      if ((L.skipped?.[i] || []).includes(s.stop_name)) { delete st.expected; delete st.delay; st.skipped = true; }
      // un arrêt où cette course ne prend personne, ou ne dépose personne :
      // pickup_type / drop_off_type 1, comme gtfs2 les recopie de stop_times
      if ((L.noBoard?.[i] || []).includes(s.stop_name)) st.pickup_type = 1;
      if ((L.noAlight?.[i] || []).includes(s.stop_name)) st.drop_off_type = 1;
      stops[s.stop_id] = st;
    }
    trips[L.tripIds[i]] = { stops };
  });
  return { type: "FeatureCollection",
           properties: { trip_id: L.tripIds[0], route_id: n.route_id, direction_id: String(n.direction_id), realtime: L.rtRuns > 0 },
           features: [], trips };
}

/* ── Les capteurs, tels que gtfs2 les expose ─────────────────────────────
 * Un capteur par ligne, avec les attributs que la carte lit vraiment : les
 * passages théoriques, ceux du temps réel, et les retards. */
const states = {};

function sensor(file, opts = {}) {
  const n = network[file];
  const rows = deps[file] || [];
  // `suffix` donne un identifiant distinct à partir du même instantané, ce dont
  // la page pips a besoin : la même ligne y paraît plusieurs fois, dans des
  // états différents, et deux états ne peuvent pas partager un capteur.
  const id = `sensor.gtfs2_${file.replace("-", "_")}${opts.suffix ? "_" + opts.suffix : ""}`;

  // Le temps réel s'écarte du théorique : c'est ce décalage que la carte
  // met en avant. L'instantané ne portait pas de retard (pris avant le
  // premier passage), donc la page en pose de plausibles là où il en faut.
  const late = opts.delays || [];
  const theo = rows.map((r) => iso(r.time));
  const real = rows.map((r, i) => iso(r.time + (late[i] ?? r.delay ?? 0)));

  states[id] = {
    entity_id: id,
    state: theo[0] || "unavailable",
    last_updated: new Date().toISOString(),
    attributes: {
      friendly_name: `${n.short_name} — ${n.reference.stop_name}`,
      next_departures: theo,
      next_departures_realtime: real,
      next_delays_realtime: rows.map((r, i) => late[i] ?? r.delay ?? 0),
      // Durée théorique de bout en bout, plausible pour la ligne :
      // l'instantané n'en porte pas, la page en pose comme pour les retards.
      // un tableau donne sa durée à chaque passage (un vrai horaire varie :
      // heures creuses, détours) ; un nombre vaut pour tous
      next_departures_durations: rows.map((r, i) => Array.isArray(opts.duration)
        ? (opts.duration[i] ?? opts.duration[opts.duration.length - 1])
        : (opts.duration ?? 19)),
      origin_station_stop_name: n.reference.stop_name,
      // La carte coupe cette valeur sur « : » et garde la première moitié,
      // qu'elle affiche ET apparie aux arrêts du tracé. Ce doit donc être
      // l'identifiant, pas le nom — le nom voyage dans origin_station_stop_name.
      origin_station_stop_id: n.reference.stop_id,
      destination_station_stop_name: opts.destination || n.terminus,
      route_route_short_name: n.short_name,
      route_route_color: n.color.slice(1),
      route_route_type: n.route_type,
      route_route_id: n.route_id,
      trip_direction_id: n.direction_id,
      vehicle_positions_file: `${file}.json`,
      // la course de chaque passage, ce par quoi le fichier de tronçon est
      // indexé, sous le nom que gtfs2 publie
      // la vraie course de l'instantané quand il la donne : c'est ce qui
      // relie un passage au véhicule qui l'assure, et la carte ne garde
      // que ceux-là quand une ligne est choisie
      next_departures_trips: rows.map((r, i) => r.trip_id || `${id}-trip-${i}`),
      gtfs_rt_updated_at: iso(Math.round(Date.parse(snap.taken_at) / 1000)),
      ...(opts.attributes || {}),
    },
  };
  // la course derrière chaque heure temps réel, dans l'ordre des heures,
  // comme gtfs2 la publie : c'est par elle que la carte apparie le temps
  // réel à son horaire. Posée après les surcharges, sur leurs propres ids
  {
    const at = states[id].attributes;
    if (!at.next_departures_realtime_trips && Array.isArray(at.next_departures_realtime)
        && at.next_departures_realtime.length === at.next_departures_trips.length) {
      at.next_departures_realtime_trips = [...at.next_departures_trips];
    }
  }
  // un capteur qui nomme un fichier de tronçon : le harnais le sert d'après
  // les passages du capteur, tels qu'ils sont après les surcharges
  if (opts.leg) {
    const at = states[id].attributes;
    const key = `${file}_leg_${opts.suffix || "x"}`;
    at.leg_geojson_file = `${key}.json`;
    const originId = String(at.origin_station_stop_id || "").split(": ")[0];
    const origin = n.stops.find((s) => s.stop_id === originId) || n.reference;
    LEGS[key] = {
      file,
      // iso() shifts every clock it formats: hand it the unshifted epoch back
      theo: at.next_departures.map((v) => Math.round(Date.parse(v) / 1000) - SHIFT),
      delays: at.next_delays_realtime || [],
      tripIds: at.next_departures_trips,
      originSeq: origin.stop_sequence,
      rtRuns: opts.rtRuns ?? 3,
      skipped: opts.skipped || null,
      noBoard: opts.noBoard || null,
      noAlight: opts.noAlight || null,
    };
  }
  return id;
}

const tramA = sensor("tram-a", { delays: [0, 62, 0, 130, 0, 0], duration: [26, 26, 31, 26, 28, 26] });
const tramB = sensor("tram-b", { delays: [45, 0, 0, 0, 190, 0], duration: [24, 27, 24, 24, 30, 24] });
const bus40 = sensor("bus-40", { delays: [0, 0, 95, 0, 0, 0], duration: [19, 23, 19, 26, 19, 19] });

// Le fond de carte ne passe plus par Home Assistant : la carte charge
// MapLibre et les styles VersaTiles depuis leurs CDN, le harnais n'a donc
// rien à simuler de ce côté, mais Chrome doit avoir accès à internet.
const hass = {
  locale: { language: lang },
  language: lang,
  themes: { darkMode: dark },
  states,
  callService() {},
};

/* ── Pages ──────────────────────────────────────────────────────────────── */
const stage = document.getElementById("stage");

// `?width=auto` laisse la scène prendre la largeur de la fenêtre, pour
// éprouver la carte dans une colonne étroite. Les captures de la
// documentation, elles, gardent des largeurs fixes.
const fluide = q.get("width") === "auto";
if (fluide) {
  const style = document.createElement("style");
  style.textContent = "#stage { grid-template-columns: 1fr !important; padding: 10px } .cell { width: auto !important }";
  document.head.appendChild(style);
}

function card(config, caption, swatch, width) {
  const cell = document.createElement("div");
  cell.className = "cell";
  if (width && !fluide) cell.style.width = width + "px";
  if (caption) {
    const cap = document.createElement("div");
    cap.className = "caption";
    cap.innerHTML = (swatch ? `<span class="swatch" style="background:${swatch}"></span>` : "") + caption;
    cell.appendChild(cap);
  }
  const el = document.createElement("gtfs2-live-card");
  // la configuration d'origine : la carte réécrit la sienne, et un test qui
  // reconstruit la carte (la mémoire des choix) en a besoin telle quelle
  // la langue vient du profil, hass.locale, comme dans Home Assistant
  el.harnessConfig = { ...config };
  el.setConfig({ ...config });
  el.hass = hass;
  cell.appendChild(el);
  stage.appendChild(cell);
  return el;
}

const COLORS = Object.fromEntries(
  Object.entries(network).map(([k, v]) => [k, v.color]));

/* Déplie les sections de l'éditeur. Repliées, elles ne montrent que leur
 * titre ; les ouvrir est ce que fait un utilisateur qui cherche un réglage,
 * et c'est la seule façon de photographier la configuration entière.
 *
 * Un observateur plutôt qu'une attente : sous `--virtual-time-budget`, Chrome
 * fait avancer les minuteries à sa main, et une boucle qui dort peut consommer
 * tout le budget avant que le reste de la page n'ait tourné. Réagir à la
 * mutation ne coûte, lui, aucun temps virtuel. */
function openSections(ed) {
  const open = () => {
    const secs = ed.querySelectorAll("details");
    secs.forEach((d) => { d.open = true; });
    return secs.length >= 3;
  };
  if (open()) return;
  const mo = new MutationObserver(() => { if (open()) mo.disconnect(); });
  mo.observe(ed, { childList: true, subtree: true });
}

/* Choisit une destination dans l'entête, comme le ferait un clic. `li` est
 * le rang de la puce : sur une carte de lignes qui vont chacune ailleurs,
 * celui de la ligne dans la liste `lines` de la configuration. */
async function selectLine(el, li) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 60; i++) {
    // une puce de destination sur une carte de trajets, le badge de la ligne
    // sur une carte de lignes : c'est lui qui filtre dans la vue Lignes
    const root = el.shadowRoot;
    const chip = root?.querySelectorAll('#header .dest[data-action="dest"]')[li]
      || root?.querySelectorAll('#header .badge[data-action="line"]')[li];
    if (chip) {
      chip.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
      await wait(1500);   // le temps que la carte se recadre et charge ses tuiles
      return;
    }
    await wait(100);
  }
}

/* Le flux raye des courses après coup : une fois la carte dessinée, le
 * capteur perd la course de ses listes (ce que fait gtfs2, qui passe à la
 * suivante) et n'en garde que l'id dans cancelled_trips_realtime ou
 * skipped_trips_realtime. Un nouvel objet hass, avec de nouveaux états,
 * puisque la carte compare les états par identité. */
async function strike(el, hits) {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 60 && !el.shadowRoot?.querySelector(".row"); i++) await wait(100);
  const next = { ...states };
  for (const [id, k, kind] of hits) {
    const at = { ...states[id].attributes };
    const tid = at.next_departures_trips[k];
    for (const key of ["next_departures", "next_departures_realtime", "next_delays_realtime",
                       "next_departures_durations", "next_departures_trips", "next_departures_realtime_trips"]) {
      if (Array.isArray(at[key])) at[key] = at[key].filter((_, i) => i !== k);
    }
    at[kind === "cancelled" ? "cancelled_trips_realtime" : "skipped_trips_realtime"] = [tid];
    next[id] = { ...states[id], attributes: at, last_updated: new Date().toISOString() };
  }
  el.hass = { ...hass, states: next };
}

/* Ouvre la bulle d'un véhicule, comme le ferait un clic dessus.
 *
 * Deux choses doivent arriver avant : la carte doit avoir dessiné ses
 * marqueurs, et le véhicule doit avoir bougé une fois — la vitesse affichée
 * se mesure entre deux positions, et une seule ne dit rien. On avance donc le
 * véhicule de quelques dizaines de mètres le long de son tracé, on laisse la
 * carte relire ses positions, puis on clique. */
async function openPopup(el, file = "tram-b") {
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  for (let i = 0; i < 60 && !el.shadowRoot?.querySelector(".bus"); i++) await wait(100);

  const first = POS[file].features[0];
  if (first) {
    const n = network[file];
    // avancer le long du tracé, vers le point le plus proche suivant
    const [lon, lat] = first.geometry.coordinates;
    let best = 0, bd = Infinity;
    n.shape.forEach(([x, y], i) => {
      const d = (x - lon) ** 2 + (y - lat) ** 2;
      if (d < bd) { bd = d; best = i; }
    });
    const next = n.shape[Math.min(best + 2, n.shape.length - 1)];
    first.geometry.coordinates = next;
    await el._fetchAll(true);
    await wait(400);
  }

  const bus = el.shadowRoot?.querySelector(`.bus`);
  if (!bus) return;
  bus.dispatchEvent(new MouseEvent("click", { bubbles: true, composed: true }));
  // le suivi recadre sur le véhicule : les tuiles de ce niveau de zoom ne
  // sont pas encore chargées, et une capture prise trop tôt montre un fond gris
  await wait(2500);
}

        if (root.querySelector("style[data-harness]")) return;

          + " box-shadow: none !important; overflow: visible !important }"
          + " .header { padding: 12px 10px !important }"

  } else if (page === "destinations") {

    // Le bandeau seul, sous toutes les formes de trajet qu'une carte peut
    // porter, sur les vrais arrêts du réseau : un direct, une
    // correspondance, plusieurs chemins vers le même lieu, plusieurs lieux,
    // un aller-retour, une chaîne de trois, et des libellés de ligne larges.
    // Carte masquée : ce qui est jugé ici, ce sont les plaques de ligne et
    // la place qu'elles prennent quand le nom, l'heure et le compte à
    // rebours se disputent déjà la largeur.
    stage.style.gridTemplateColumns = "420px";
    const stopOf = (f, name) => network[f].stops.find((s) => s.stop_name === name);
    const ends = (f, a, b) => {
      const o = stopOf(f, a), d = stopOf(f, b);
      return { origin_station_stop_id: o.stop_id, origin_station_stop_name: o.stop_name,
               destination_station_stop_id: d.stop_id, destination_station_stop_name: d.stop_name };
    };
    const run = (f, a, b) => (stopOf(f, b).stop_sequence - stopOf(f, a).stop_sequence) * 90;
    const aDur = Math.round(run("tram-a", "L'Indien", "Gare d'Orléans") / 60);
    const bDur = Math.round(run("tram-b", "De Gaulle", "Halmagrand") / 60);
    const waits = [300, 480, 240, 600, 360, 420];
    const bTheo = deps["tram-a"].map((r, i) => r.time + run("tram-a", "L'Indien", "De Gaulle") + waits[i]);
    // un deuxième tronçon posé quelques minutes après l'arrivée du premier,
    // comme un horaire cadencé : sans quoi la correspondance n'a pas de suite
    const legA = (sfx, extra) => sensor("tram-a", { suffix: sfx, leg: true, delays: [0, 62, 0, 130, 0, 0],
      duration: aDur, attributes: { friendly_name: "A — L'Indien → Gare d'Orléans",
        ...ends("tram-a", "L'Indien", "Gare d'Orléans"), ...(extra || {}) } });
    const legB = (sfx, extra) => sensor("tram-b", { suffix: sfx, leg: true, duration: bDur, attributes: {
      friendly_name: "B — De Gaulle → Halmagrand", ...ends("tram-b", "De Gaulle", "Halmagrand"),
      next_departures: bTheo.map(iso), next_departures_realtime: bTheo.map(iso),
      next_delays_realtime: bTheo.map(() => 0), next_departures_durations: bTheo.map(() => bDur),
      next_departures_trips: bTheo.map((_, i) => `tram-b-${sfx}-trip-${i}`), ...(extra || {}) } });
    const places = { "Gare d'Orléans": ["Gare d'Orléans", "Gare d'Orléans - Quai E"] };
    const head = (lines, trips, extra) => ({ lines, trips, places, max_departures: 4, show_map: false, ...(extra || {}) });

    // 1 — un lieu, un direct : le bus 40 de Halmagrand à L'Indien
    card(head([bus40], [["Halmagrand", "L'Indien"]]), "1 · un lieu, un direct", null, 420);
    // 2 — un lieu, une correspondance : deux plaques, un médaillon à deux modes
    card(head([legA("c2a"), legB("c2b")], [["L'Indien", "Halmagrand"]]), "2 · un lieu, une correspondance", null, 420);
    // 3 — le même lieu par deux chemins : A puis B, ou A puis le 40, et la
    // rangée « Pour y aller » qui départage
    card(head([legA("c3a"), legB("c3b"), bus40], [["L'Indien", "Halmagrand"]]), "3 · un lieu, deux chemins", null, 420);
    // 4 — deux lieux, chacun direct : deux chips côte à côte, une plaque chacun
    card(head([bus40], [["Halmagrand", "L'Indien"], ["Halmagrand", "Gaston Galloux"]]),
         "4 · deux lieux, deux directs", null, 420);
    // 5 — deux lieux dissymétriques : un direct d'un côté, une correspondance
    // de l'autre. Deux plaques contre une, dans deux colonnes de même largeur
    card(head([legA("c5a"), legB("c5b")], [["L'Indien", "Halmagrand"], ["L'Indien", "Zénith"]]),
         "5 · deux lieux, l'un avec correspondance", null, 420);
    // 6 — aller et retour : les trams à l'aller, le 40 au retour
    card(head([legA("c6a"), legB("c6b"), bus40], [["L'Indien", "Halmagrand"]]), "6 · aller et retour", null, 420);
    // 7 — trois lieux, dont un seul revient
    card(head([legA("c7a"), legB("c7b"), bus40], [["L'Indien", "Halmagrand"], ["L'Indien", "Zénith"], ["L'Indien", "Cathédrale"]]),
         "7 · trois lieux, un seul revient", null, 420);
    // 8 — trois lignes chaînées : A, B, puis le 40 de Halmagrand à Gaston
    // Galloux ; trois plaques, et le médaillon qui doit tenir deux modes
    card(head([legA("c8a"), legB("c8b"), bus40], [["L'Indien", "Gaston Galloux"]]), "8 · trois lignes chaînées", null, 420);
    // 9 — des libellés larges : « K8 » et « P8 » au lieu de « A » et « B ».
    // C'est le cas qui dit si les plaques tiennent sur la ligne de l'heure
    card(head([legA("c9a", { route_route_short_name: "K8" }), legB("c9b", { route_route_short_name: "P8" })],
              [["L'Indien", "Halmagrand"]]), "9 · libellés larges (K8, P8)", null, 420);
  } else if (page === "paris") {
    // Paris — Orléans, hors du réseau TAO : l'Intercités direct de
    // Paris-Austerlitz à Orléans, le même voyage coupé aux Aubrais avec un
    // TER pour finir, et un troisième qui pousse jusqu'à l'Hôpital de la
    // Source en tram. Lignes forgées de bout en bout — un tracé synthétique
    // par ligne, parce que sans géométrie la carte ne sait pas dater
    // l'arrivée d'un tronçon et ne chaîne aucune correspondance.
    stage.style.gridTemplateColumns = "460px";
    const PLACES = {
      paris:    { id: "paris-austerlitz", name: "Paris Austerlitz",    lat: 48.8420, lon: 2.3660 },
      etampes:  { id: "etampes",          name: "Étampes",             lat: 48.4340, lon: 2.1610 },
      aubrais:  { id: "les-aubrais",      name: "Les Aubrais",         lat: 47.9250, lon: 1.9060 },
      orleans:  { id: "orleans",          name: "Orléans",             lat: 47.9030, lon: 1.9050 },
      univ:     { id: "universite",       name: "Université",          lat: 47.8460, lon: 1.9360 },
      source:   { id: "hopital-source",   name: "Hôpital de la Source", lat: 47.8390, lon: 1.9370 },
    };
    // Une ligne synthétique, servie par le même chemin que les lignes TAO :
    // POS pour que l'interception réponde, network pour que le fichier de
    // tracé soit fabriqué à la demande. Un point de rencontre partagé par
    // deux lignes garde le même stop_id des deux côtés — c'est à cela que la
    // carte reconnaît une correspondance directe plutôt qu'une marche.
    const line = (key, short, color, type, keys) => {
      const stops = keys.map((k, i) => ({ ...PLACES[k], stop_id: PLACES[k].id,
        stop_name: PLACES[k].name, stop_sequence: i + 1 }));
      network[key] = {
        short_name: short, color: "#" + color, route_type: type,
        route_id: "route-" + key, direction_id: 0,
        terminus: stops[stops.length - 1].stop_name,
        reference: stops[0], stops,
        shape: stops.map((s) => [s.lon, s.lat]),
      };
      // un véhicule en course, sinon la carte voit une source sans positions
      // et draine le médaillon comme un flux devenu muet
      const mid = stops[Math.floor(stops.length / 2)];
      POS[key] = { type: "FeatureCollection", features: [{ type: "Feature",
        geometry: { type: "Point", coordinates: [mid.lon, mid.lat] },
        properties: { vehicle_id: key + "-1", route_id: "route-" + key,
                      route_short_name: short, trip_id: key + "-trip-0", bearing: 180 } }] };
      return key;
    };
    line("ic-p8",  "P8", "0b5ea8", 2, ["paris", "etampes", "orleans"]);
    line("ic-k8",  "K8", "b3123c", 2, ["paris", "etampes", "aubrais"]);
    line("ter-l",  "L",  "6a3d9a", 2, ["aubrais", "orleans"]);
    line("tram-src", "A", "e4002b", 0, ["orleans", "univ", "source"]);
    line("ic-p8r", "P8", "0b5ea8", 2, ["orleans", "etampes", "paris"]);
    line("ic-k8r", "K8", "b3123c", 2, ["aubrais", "etampes", "paris"]);
    line("ter-lr", "L",  "6a3d9a", 2, ["orleans", "aubrais"]);

    const base = deps["tram-a"].map((r) => r.time);   // six départs, écarts réels
    // un capteur sur une de ces lignes : ses extrémités, ses heures, sa durée
    const mkRun = (key, sfx, from, to, opts) => {
      const n = network[key], a = PLACES[from], b = PLACES[to];
      return sensor(key, { suffix: sfx, attributes: {
        friendly_name: `${n.short_name} — ${a.name} → ${b.name}`,
        origin_station_stop_name: a.name, origin_station_stop_id: a.id,
        destination_station_stop_name: b.name, destination_station_stop_id: b.id,
        next_departures: opts.times.map(iso),
        next_departures_realtime: opts.times.map((t, i) => iso(t + (opts.delays?.[i] ?? 0))),
        next_delays_realtime: opts.times.map((_, i) => opts.delays?.[i] ?? 0),
        next_departures_durations: opts.times.map(() => opts.dur),
        next_departures_trips: opts.times.map((_, i) => `${sfx}-trip-${i}`),
      } });
    };
    // l'état du capteur est son premier départ : ces lignes n'ont pas de
    // passages dans l'instantané, donc la fabrique l'a posé à « unavailable »
    // et le pied de carte s'en plaignait
    const run = (key, sfx, from, to, opts) => {
      const id = mkRun(key, sfx, from, to, opts);
      states[id].state = iso(opts.times[0]);
      return id;
    };
    const after = (times, dur, wait) => times.map((t) => t + dur * 60 + wait);

    const p8 = run("ic-p8", "p8", "paris", "orleans",
      { dur: 65, times: base, delays: [0, 0, 240, 0, 0, 0] });
    const k8 = run("ic-k8", "k8", "paris", "aubrais",
      { dur: 58, times: base.map((t) => t + 600), delays: [0, 180, 0, 0, 0, 0] });
    const terL = run("ter-l", "terl", "aubrais", "orleans",
      { dur: 7, times: after(base.map((t) => t + 600), 58, 420) });
    const tramSrc = run("tram-src", "tsrc", "orleans", "source",
      { dur: 22, times: after(base, 65, 480) });
    const p8r = run("ic-p8r", "p8r", "orleans", "paris",
      { dur: 65, times: base.map((t) => t + 300), delays: [0, 0, 0, 120, 0, 0] });
    const terLr = run("ter-lr", "terlr", "orleans", "aubrais",
      { dur: 7, times: base.map((t) => t + 900) });
    const k8r = run("ic-k8r", "k8r", "aubrais", "paris",
      { dur: 58, times: after(base.map((t) => t + 900), 7, 360) });

    const c = (lines, trips, extra) => ({ lines, trips, show_map: false, ...(extra || {}) });
    const toOrleans = ["Paris Austerlitz", "Orléans"];
    // 1 — le direct seul : une plaque, un train, rien à choisir
    card(c([p8], [toOrleans], { max_departures: 4 }), "1 · Paris → Orléans, direct", null, 460);
    // 2 — la correspondance seule : deux plaques, le changement aux Aubrais
    card(c([k8, terL], [toOrleans], { max_departures: 4 }), "2 · Paris → Orléans via Les Aubrais", null, 460);
    // 3 — le même lieu par deux chemins : trois lignes, et la rangée
    // « Pour y aller » qui départage le direct du passage par Les Aubrais
    card(c([p8, k8, terL], [toOrleans], { max_departures: 5 }), "3 · les deux chemins vers Orléans", null, 460);
    // 4 — deux destinations : Orléans, et l'Hôpital de la Source au bout du
    // tram. Deux plaques d'un côté, une de l'autre, deux modes mêlés
    card(c([p8, tramSrc], [toOrleans, ["Paris Austerlitz", "Hôpital de la Source"]], { max_departures: 5 }),
         "4 · Orléans et l'Hôpital de la Source", null, 460);
    // 5 — aller et retour, chacun par ses deux chemins : un trajet, et la
    // carte trouve le retour sur les lignes de l'autre sens
    card(c([p8, k8, terL, p8r, terLr, k8r], [toOrleans], { max_departures: 5 }),
         "5 · aller et retour, deux chemins chacun", null, 460);
    // 6 — tout ensemble : deux destinations, un retour, un titre
    card(c([p8, k8, terL, p8r, tramSrc], [toOrleans, ["Paris Austerlitz", "Hôpital de la Source"]],
           { title: "Paris ↔ Orléans", max_departures: 6 }), "6 · la carte complète", null, 460);
  } else if (page === "departures") {
    // Le tableau seul, carte repliée : retards, passages théoriques, jours.
    stage.style.gridTemplateColumns = "420px";
    card({ lines: [tramA, tramB, bus40], title: "Gare d'Orléans", max_departures: 8, show_duration: true },
         null, null, 420);
  } else if (page === "board") {
    // La vue tableau des départs (vue Lignes) : colonnes départ,
    // arrivée, durée, mode, statut, ligne — chaque durée colorée contre le
    // meilleur temps de sa propre ligne, tri fixe sur l'heure de départ.
    // Large exprès : on doit voir les heures groupées à gauche, statut et
    // ligne calés à droite, la colonne mode absorbant seule le surplus.
    stage.style.gridTemplateColumns = "640px";
    card({ lines: [tramA, tramB, bus40], title: "Gare d'Orléans", max_departures: 8,
           show_map: false }, null, null, 640);
  } else if (page === "map") {
    // La carte seule, avec les véhicules de l'instantané sur leur tracé.
    stage.style.gridTemplateColumns = "460px";
    card({ lines: [tramA, tramB], title: "Trams A and B", max_departures: 2, map_aspect: "4/3" },
         null, null, 460);
  } else if (page === "noposition") {
    // Une source sans positions temps réel : le capteur n'annonce aucun
    // fichier de positions, seulement son tracé. La carte ne va donc chercher
    // aucun fichier de positions (pas de 404 à répétition) et dessine quand
    // même le trajet, ses arrêts et la station d'origine.
    stage.style.gridTemplateColumns = "460px";
    const tramSansRt = sensor("tram-a", {
      suffix: "sansrt",
      attributes: { vehicle_positions_file: undefined, route_geojson_file: "tram-a_route.json" },
    });
    card({ entity: tramSansRt, title: "Tram A, schedule only", max_departures: 2, map_aspect: "4/3" },
         null, null, 460);
  } else if (page === "editor") {
    // L'éditeur visuel, tel qu'il apparaît dans le sélecteur de cartes : les
    // lignes se choisissent en un seul champ, le reste se replie.
    stage.style.gridTemplateColumns = "420px";
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.width = "420px";
    const ed = document.createElement("gtfs2-live-card-editor");
    cell.appendChild(ed);
    stage.appendChild(cell);
    ed.setConfig({ lines: [tramA, tramB, bus40], title: "Gare d'Orléans",
                   trips: [["Gare d'Orléans - Quai E", "Halmagrand"]], max_departures: 6 });
    ed.hass = hass;
    openSections(ed);
  } else if (page === "selected") {
    // Une ligne choisie par son badge, dans la vue Lignes : les départs ne
    // gardent que les siens, la carte n'éclaire que son tracé, épingle ses
    // deux bouts et ne garde que les véhicules des courses du tableau. Ici le
    // tram A, dont la rame 44 assure le premier départ ; les trams B de
    // l'instantané roulent tous dans l'autre sens.
    stage.style.gridTemplateColumns = "500px";
    const el = card({ lines: [tramA, tramB, bus40], title: "Gare d'Orléans",
                      max_departures: 5 }, null, null, 500);
    selectLine(el, 0);
  } else if (page === "popup") {
    // Le suivi d'un véhicule : on clique sur son marqueur, la carte le suit,
    // et la bulle dit sa ligne, son terminus, son prochain arrêt et sa
    // vitesse. La vitesse se déduit de deux positions successives, donc la
    // page en joue une seconde avant d'ouvrir la bulle.
    stage.style.gridTemplateColumns = "460px";
    const el = card({ lines: [tramA, tramB], title: "Trams A and B",
                      max_departures: 2, map_aspect: "4/3" }, null, null, 460);
    openPopup(el);
  } else if (page === "entete12") {
    // L'entête chargée : une puce par destination, sur une grille régulière,
    // pour 5, 12 et 13 destinations dont la première choisie, puis 9 sans
    // choix. Les capteurs reprennent les trois lignes du réseau avec un autre
    // terminus chacun, ce qui en fait autant de destinations distinctes : la
    // même ligne vers le même terminus ne ferait qu'une puce.
    stage.style.gridTemplateColumns = "560px";
    const files = ["bus-40", "tram-a", "tram-b"];
    const used = new Set();
    const pool = Array.from({ length: 13 }, (_, i) => {
      const f = files[i % 3];
      const stops = network[f].stops;
      let k = (i * 7 + 3) % stops.length;
      while (used.has(stops[k].stop_name)) k = (k + 1) % stops.length;
      used.add(stops[k].stop_name);
      return sensor(f, { suffix: "e" + i, attributes: { destination_station_stop_name: stops[k].stop_name } });
    });
    for (const n of [5, 12, 13]) {
      const el = card({ lines: pool.slice(0, n), max_departures: 2 },
        `${n} destinations`, null, 560);
      selectLine(el, 0);
    }
    card({ lines: pool.slice(0, 9), max_departures: 2 },
      "9 destinations, none picked", null, 560);
  } else if (page === "narrow") {
    // Une colonne étroite, comme un panneau latéral ou un téléphone. Chrome
    // headless refuse une fenêtre de moins de 500 px environ, donc l'étroitesse
    // se joue ici, sur la cellule, et non sur la fenêtre.
    stage.style.gridTemplateColumns = "300px";
    card({ lines: [tramA, tramB, bus40], title: "Gare d'Orléans", max_departures: 4 },
         null, null, 300);
  } else {
    throw new Error(`page inconnue : ${page}`);
  }
} catch (err) {
  fatal(err);
}

/* Dire au captureur quand la page est prête.
 *
 * Elle se construit de façon asynchrone — traductions, positions, tuiles,
 * formulaires — et rien de tout cela n'est observable de l'extérieur. La page
 * l'annonce donc elle-même dans `document.title`, avec la hauteur qu'elle
 * occupe : `shots.py` la lit et photographie à cette taille, plutôt qu'à un
 * nombre tenu à la main qui couperait la dernière carte en silence.
 *
 * Le signal est la stabilité, pas un état particulier : dès que le contenu
 * attendu est là et que la hauteur ne bouge plus d'un tour à l'autre, la page
 * est prête. Cela vaut pour la carte comme pour l'éditeur, sans avoir à
 * décrire ce que chaque page doit contenir. */
const ready = () => {
  if (page === "editor") {
    const ed = stage.querySelector("gtfs2-live-card-editor");
    return !!ed && ed.querySelectorAll("details[open]").length >= 3;
  }
  const cards = [...stage.querySelectorAll("gtfs2-live-card")];
  if (!cards.length) return false;
  if (page === "pips") {
    // la page ne vaut que si les états qu'elle illustre sont bien là : la
    // pastille muette attend l'échec du fetch de son fichier de positions
    const has = (sel) => cards.some((c) => c.shadowRoot?.querySelector(sel));
    return cards.every((c) => c.shadowRoot?.querySelector(".dest"))
      && has(".dmark.mute") && has(".dmark.alert") && has(".dmark.rest");
  }
  return cards.every((c) => {
    const root = c.shadowRoot;
    if (!root?.querySelector("ha-card")) return false;
    // le fond MapLibre annonce lui-même son repos (data-basemap="idle") :
    // sans lui la capture montrerait les tracés sur un fond nu. Vaut pour
    // toute carte qui montre son volet, les pages du tableau comprises
    const wrap = root.querySelector(".map-wrap");
    if (wrap && wrap.dataset.basemap !== "idle") return false;
    if (page === "departures" || page === "board") return true;
    // l'entête par destination n'est prête qu'avec ses puces
    if (page === "destinations") return !!root.querySelector(".dest");
    // la page n'est prête que les courses rayées : deux, une par sorte
    if (page === "struck") return root.querySelectorAll(".chip-struck").length >= 2 || !!root.querySelector(".jbroken");
    if (!root.querySelector("svg")) return false;
    // la page popup n'est prête que la bulle ouverte
    if (page === "popup") {
      const pop = root.querySelector(".map-pop");
      return !!pop && !pop.hidden;
    }
    return true;
  });
};

let lastHeight = -1, stable = 0, waited = 0;
const poll = setInterval(() => {
  waited += 100;
  const h = Math.ceil(stage.getBoundingClientRect().bottom);
  if (ready() && h === lastHeight) stable += 1; else stable = 0;
  lastHeight = h;
  // deux tours de suite à la même hauteur : plus rien n'arrive
  // trente secondes couvrent MapLibre, son style et ses tuiles sur un cache
  // froid ; passé ce délai la page se déclare prête telle quelle
  if (stable >= 3 || waited > 30000) {
    clearInterval(poll);
    const r = stage.getBoundingClientRect();
    // passé le délai sans que la page ait ce qu'elle doit montrer, elle le
    // dit : shots.py refuse alors de photographier une page à moitié faite
    const late = stable < 3 && !ready();
    // Seule la hauteur est mesurée. La largeur reste celle que shots.py a
    // donnée : une page fluide s'étire à la fenêtre, et lui rendre sa propre
    // largeur ferait tourner la mesure en rond.
    document.title = `${late ? "late" : "ready"} ${innerWidth}x${Math.ceil(r.bottom + 20)} — `
      + document.title;
  }
}, 100);
</script>
</body>
</html>
